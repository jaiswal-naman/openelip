# Which model answers which task, and what it costs (PLT-05; ARCHITECTURE 5.8; AI_SYSTEM 2.2 and 2.12).
#
# The gateway reads this file on every call, so an edit needs no code change and no restart.
# `python -m app.cli models sync` copies it into model_registry; the deploy runs it.
#
# The environment picks the provider: LLM_PROVIDER names an entry under [providers] (default "anthropic").
# "openai_compatible" means any OpenAI-style server: the `local` entry at LLM_BASE_URL when that is set, else `openai`.
# A provider with no key means "AI disabled" (503 ai_disabled); nothing is called. `fake` is refused in production.
#
# Prices are US dollars per million tokens, read from the providers' pricing pages: Anthropic's on 2026-11-22, OpenAI's
# on 2026-11-28 (AI_SYSTEM 2.12).
# A model that is not local needs both prices and a date. Write "unknown" for a price nobody has checked: the gateway
# then refuses the route instead of guessing a cost. A local model has no per-token price; its calls cost 0.
# A task name with dots must be quoted: [tasks."job.requirements.extract"].
#
# Identified data (AI_SYSTEM 2.6) goes only to the provider this installation is set to use, which in local mode is the
# one whose key the person pasted in. That provider's retention_note is part of the AI-processing consent the person
# agrees to before anything is sent: app/trust/consent.py names the provider, the classes of data it receives and its
# note, and hashes them into the wording version, so changing any of them asks everyone again. Anthropic does not keep
# real-time calls by default; OpenAI keeps them in abuse-monitoring logs for up to 30 days unless it approves zero data
# retention for the account, and its note says so. A route is picked by provider alone; nothing falls back from one
# provider to another.

[providers.anthropic]
label = "Anthropic"
adapter = "anthropic"
structured_output = "json_schema"
retention_note = "Provider terms as read on 2026-11-22: real-time calls are not retained by default outside the Covered Models; batch requests are kept 29 days and are not eligible for zero data retention; structured-output schemas are cached up to 24 hours, so they never contain personal data; flagged content may be kept up to 2 years; no training without express permission."

# OpenAI, terms read from OpenAI's own pages on 2026-11-28 (the retention_note below; URLs in AI_SYSTEM 2.12).
# Models: gpt-6-luna where Anthropic uses claude-haiku-5-5 and gpt-6.2-sol where it uses claude-sonnet-5-5; each pair
# has the same price. Prices are the standard tier for prompts up to 272k tokens, as on the pricing page. That page
# also lists cached-input and cache-write rates; the ledger prices every prompt token at the input rate.
# Both models reason before they answer, and max_completion_tokens counts that reasoning together with the answer, so a
# cap that suits Anthropic may cut an answer short here (a schema_invalid row in llm_calls). A model entry may name a
# reasoning_effort, which the adapter sends as Chat Completions' reasoning_effort. gpt-6-luna's page lists none, low,
# medium (the default), high, xhigh and max: its routes say low, and none for twin.classify, a classification with a
# 300-token cap (OpenAI's reasoning guide names classification as a use of none). gpt-6.2-sol's page lists no values and
# says only that the API rejects none, so its routes name no effort and run at the model's default. No gold-set run has
# measured either model on these tasks.
[providers.openai]
label = "OpenAI"
adapter = "openai_compatible"
base_url = "https://api.openai.com/v1"
structured_output = "json_schema"
retention_note = "Provider terms as read on 2026-11-28: API data is not used for training unless you agree to it; abuse-monitoring logs, which may contain prompts and responses, are kept up to 30 days by default (longer when the law requires or to protect against harm); zero data retention needs OpenAI's approval."

[providers.local]
label = "Local model server"
adapter = "openai_compatible"
base_url = "http://llm:11434/v1"
structured_output = "json_object"   # Ollama documents JSON mode; its json_schema support is unverified
token_limit_param = "max_tokens"    # the only limit Ollama's OpenAI-compatible endpoint documents
is_local = true
retention_note = "A model server you run yourself. Nothing is sent to a third party."

[providers.fake]
label = "Recorded responses"
adapter = "fake"
is_local = true
retention_note = "No model is called: answers are replayed from recorded files, so nothing leaves this process."

[tasks.ping]
description = "Connectivity self-test: one fixed message that carries no personal data."
data_class = "synthetic"
max_tokens = 512        # assumption: room for the answer plus any thinking the model bills as output
timeout_seconds = 30    # assumption

[tasks.ping.models.anthropic]
model = "claude-haiku-5-5"
input_usd_per_mtok = 0.10     # prompts up to 100k tokens; ping sends a dozen
output_usd_per_mtok = 0.50
price_checked_at = 2026-11-22

[tasks.ping.models.openai]
model = "gpt-6-luna"
input_usd_per_mtok = 0.10
output_usd_per_mtok = 0.50
price_checked_at = 2026-11-28
reasoning_effort = "low"

[tasks.ping.models.local]
model = "local-model"   # placeholder: set this to the model name your server runs

[tasks.ping.models.fake]
model = "recorded"

