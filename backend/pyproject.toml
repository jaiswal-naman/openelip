[project]
name = "openelip-backend"
version = "0.1.0"
description = "Verified job index, constraint-safe matching and cited explanations, as one modular monolith."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "cryptography>=43",
  "tzdata>=2024.1",  # Windows ships no IANA time-zone database for zoneinfo
  "anthropic>=2",
  "openai==3.57.0",  # ARCHITECTURE 3.6
  "prometheus-client==0.26.0",  # ARCHITECTURE 3.6
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "pdfplumber>=0.11.11",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.34",
  "fastembed==0.9.1",  # ARCHITECTURE 3.6: local embeddings (ONNX Runtime, no PyTorch)
  "geonamescache==3.0.2",  # offline place-name gazetteer for the location parser (plan 02-04)
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff",
  "mypy",
  "import-linter==2.17",
  "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib mode: no __init__.py in tests/, so tests/platform cannot shadow the standard library module.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Moved unchanged from the foundation slice, long SQL lines included. Plan 01-02 rewrites fetch.py and discover.py.
"app/ingest/adapters.py" = ["E501"]
"app/ingest/normalize.py" = ["E501"]
"app/ingest/fetch.py" = ["E501"]
"tests/ingest/test_index.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
warn_unused_configs = true
warn_redundant_casts = true  # global-only: mypy refuses it in a per-module section

# Strict on the platform layer. mypy has no per-module "strict" switch, so these are the flags it stands for.
[[tool.mypy.overrides]]
module = "app.platform.*"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff.lint.isort]
# Stated explicitly so import sorting gives the same answer on every machine.
known-first-party = ["app"]
