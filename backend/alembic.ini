[alembic]
# The migration history lives in db/ at the repository root (ARCHITECTURE 3.1).
script_location = %(here)s/../db
# Revision ids are written by hand (0001_baseline, 0002_platform), so the file name is just the revision id.
file_template = %%(rev)s
# The database URL is read by db/env.py from DATABASE_URL_MIGRATE.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
