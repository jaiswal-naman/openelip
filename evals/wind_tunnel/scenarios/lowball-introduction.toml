# Wind-tunnel scenario: the lowball persona, starting from an asked introduction. Everything here is invented (the company, the people, the pages and the
# recorded answers), written by an agent and not yet reviewed by the maintainer.
# A definition never changes: a changed one is a new `version`.

key = "lowball-introduction"
version = 1
persona = "lowball"
title = "Lowball employer, from an introduction"
start = "introduction"
labels = "agent-drafted, maintainer review pending"
invented = true
max_virtual_days = 30

[world.job]
title = "Data engineer"
company = "Gannet Logistics"
description = "Build reporting pipelines in Python. Experience with PostgreSQL."
apply_url = "https://careers.gannet.example/apply/gannet-1"
country = "US"
arrangements = ["remote"]
requirements = [
  { text = "Build reporting pipelines in Python", importance = "required" },
  { text = "Experience with PostgreSQL", importance = "required" },
]

