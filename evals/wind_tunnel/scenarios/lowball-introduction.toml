  "",
  "Education",
  "BSc Computer Science, Example University, 2017",
  "",
  "Certifications",
  "Demo Data Practitioner Certificate, 2022",
]
facts = [
  { kind = "role", statement = "Senior data engineer, Initech Demo, 2021-03 to 2024-06", attributes = { employer = "Initech Demo", title = "Senior data engineer", start_date = "2021-03", end_date = "2024-06" } },
  { kind = "achievement", statement = "Built nightly Python and PostgreSQL pipelines that cut report time by 40 percent." },
  { kind = "achievement", statement = "Led a team of three engineers on the reporting platform." },
  { kind = "role", statement = "Data analyst, Globex Demo, 2018-01 to 2021-02", attributes = { employer = "Globex Demo", title = "Data analyst", start_date = "2018-01", end_date = "2021-02" } },
  { kind = "achievement", statement = "Wrote SQL reports for the finance team." },
  { kind = "achievement", statement = "Automated month-end checks with Python scripts." },
  { kind = "skill", statement = "Python", attributes = { name = "Python" } },
  { kind = "skill", statement = "PostgreSQL", attributes = { name = "PostgreSQL" } },
  { kind = "skill", statement = "Quillscript", attributes = { name = "Quillscript" } },
