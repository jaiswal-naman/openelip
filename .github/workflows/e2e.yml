# Browser tests against the real stack (PLT-01, PLT-02, UI-03): docker compose builds and starts everything, then Playwright
# signs in with a code read from the mail catcher, uses the app and scans every screen with axe in both themes.
# It runs on pushes to main and every night, not on every pull request: it takes minutes, and ci.yml already gates pull
# requests. No secret is used: every key in .env.example is a published development value.
# Every action is pinned to a commit SHA (the version is in the comment) and the token is read-only.
name: e2e

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: sign-in journey and accessibility on the Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The job specs add invented jobs to the stack and refuse one whose Compose project is called openelip, the name the
      # repository folder gives by default. Every step uses this name: docker compose for the stack, Playwright to find it.
      COMPOSE_PROJECT_NAME: openelip_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same two commands the README gives: .env.example is the development configuration, and --wait returns once
      # every service is healthy.
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the browser tests
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      # BASE_URL and MAILPIT_URL default to the ports the stack publishes, so nothing is set here.
      - name: Run the browser tests
        working-directory: web
        run: pnpm exec playwright test tests/e2e --project=chromium
      - name: Container logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail=200
