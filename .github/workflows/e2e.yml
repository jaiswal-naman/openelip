# Browser tests against the real stack (PLT-01, PLT-02, UI-03): docker compose builds and starts everything, then Playwright
# signs in with a code read from the mail catcher, uses the app and scans every screen with axe in both themes.
# It runs on pull requests, pushes to main and every night: phase branches are tested here, in the cloud, before they
# merge, instead of on a developer machine. No secret is used: every key in .env.example is a published development value.
# Every action is pinned to a commit SHA (the version is in the comment) and the token is read-only.
# .env.example is local mode with no model provider (the README's own two commands), so the sign-in journey and the demos run
# in server mode explicitly (APP_MODE and LLM_PROVIDER below), and the `local` job runs the stack exactly as .env.example has it.
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: sign-in journey and accessibility on the Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The job specs add invented jobs to the stack and refuse one whose Compose project is called openelip, the name the
      # repository folder gives by default. Every step uses this name: docker compose for the stack, Playwright to find it.
      COMPOSE_PROJECT_NAME: openelip_e2e
      # A throwaway stack: seed the invented jobs even after its worker has imported real boards, or the job specs skip.
      E2E_SEED_JOBS: always
      # These specs sign in with an emailed code and read the fake provider's answers: the shell wins over .env in Compose.
      APP_MODE: server
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same two commands the README gives: .env.example is the development configuration, and --wait returns once
      # every service is healthy.
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the browser tests
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      # BASE_URL and MAILPIT_URL default to the ports the stack publishes, so nothing is set here.
      - name: Run the browser tests
        working-directory: web
        run: pnpm exec playwright test tests/e2e --project=chromium
      - name: Container logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  # Local mode (APP_MODE=local, the .env.example default): the stack as the README starts it. Opening the app opens the owner's
  # session with no sign-in page and no code, and the setup page asks for the model API key. No mail is read, so no mail
  # catcher is needed; the spec skips itself unless LOCAL_STACK=1.
  local:
    name: local mode, no sign-in page and the setup page, on the Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: openelip_local_e2e
      LOCAL_STACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the browser tests
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run the local mode browser test
        working-directory: web
        run: pnpm exec playwright test tests/e2e/local-mode.spec.ts --project=chromium
      - name: Container logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  # The matches and morning-brief demo (plan 04-06) needs what the stack above does not have: a database whose name ends in
  # _test, the fake model provider, and no real job boards, because the demo seed refuses anything else. That is the override
  # docker-compose.demo.yml, which also uses its own ports (8090 for the app, 8026 for Mailpit) and its own project name. The
  # spec skips itself unless DEMO_STACK=1, so the job above runs the same spec as a skip and this job runs only that spec.
  demo:
    name: matches and brief, chat and tailoring, hiring desk and campaign demos on the demo Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEMO_STACK: "1"
      BASE_URL: http://localhost:8090
      MAILPIT_URL: http://localhost:8026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the demo stack
        run: |
          cp .env.example .env
          docker compose -p openelip-demo -f docker-compose.yml -f docker-compose.demo.yml up -d --build --wait
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the browser tests
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run the demo browser test
        working-directory: web
        run: pnpm exec playwright test tests/e2e/matches-brief.spec.ts --project=chromium
      # The Phase 5 demo (plan 05-07). The fake model provider hands out each recording in order, once per process, and the
      # step above used the ones it needs, so this spec gets its own stack: the old one goes away with its volumes, a new one
      # starts. The spec seeds its own account (demo seed-matches, then demo seed-tailor, in the worker container).
      - name: Replace the demo stack with a fresh one
        run: |
          docker compose -p openelip-demo -f docker-compose.yml -f docker-compose.demo.yml down -v
          docker compose -p openelip-demo -f docker-compose.yml -f docker-compose.demo.yml up -d --build --wait
      - name: Run the chat, tailoring and applications demo browser test
        working-directory: web
        run: pnpm exec playwright test tests/e2e/chat-tailor-apply.spec.ts --project=chromium
      # The hiring desk demo (plan 06-07) needs a stack of its own for the same reason: the one above goes away with its
      # volumes, a fresh one comes up, and only this spec runs on it.
      - name: Replace the demo stack with a fresh one for the hiring desk
        run: |
          docker compose -p openelip-demo -f docker-compose.yml -f docker-compose.demo.yml down -v
          docker compose -p openelip-demo -f docker-compose.yml -f docker-compose.demo.yml up -d --build --wait
      - name: Run the hiring desk demo browser test
        working-directory: web
        run: pnpm exec playwright test tests/e2e/hiring-desk.spec.ts --project=chromium
      # The campaign demo (plan 07-07) on a fresh stack as well: its Writer and verifier answers are handed out in order.
      - name: Replace the demo stack with a fresh one for campaigns
        run: |
          docker compose -p openelip-demo -f docker-compose.yml -f docker-compose.demo.yml down -v
          docker compose -p openelip-demo -f docker-compose.yml -f docker-compose.demo.yml up -d --build --wait
      - name: Run the campaign demo browser test
        working-directory: web
        run: pnpm exec playwright test tests/e2e/campaigns.spec.ts --project=chromium
      - name: Container logs after a failure
        if: failure()
        run: docker compose -p openelip-demo -f docker-compose.yml -f docker-compose.demo.yml logs --no-color --tail=200
